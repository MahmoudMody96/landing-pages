# City gateway: bare city host (riyadh.aidy.site) redirects to that
# city's index. Add one line per new city subdomain.
map $host $city_gateway {
    default "";
    riyadh.aidy.site /sa/riyadh/;
}

server {
    listen 80;
    server_name pages.aidy.site *.aidy.site;
    root /usr/share/nginx/html;
    index index.html;

    # url-encode safe filenames (Arabic etc.)
    charset utf-8;

    # baseline security headers (HTML pages)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # enable gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Site root: city host -> its gateway, anything else -> global index.
    location = / {
        if ($city_gateway != "") {
            return 302 $city_gateway;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets (no immutable: same-URL image swaps must expire)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;

    # Health check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
